name: Validate and deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:game-rules
      - run: npm run test:game-studio
      - name: Verify Athena conversation and specialist quality
        run: |
          npm run test:experience:inspector
          npm run test:experience:tasks
          npm run test:athena-system
          npm run test:athena-response-quality
          npm run test:athena-intelligence
          npm run test:athena-communication
          npx tsx src/lib/athena/agents/experience-guidance.test.ts
      - run: npm run build
      - name: Verify Vercel deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for secret_name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${secret_name}"
              exit 1
            fi
          done
          npx vercel whoami --token="$VERCEL_TOKEN" --no-color >/dev/null
          echo "Vercel token authentication succeeded."
      - name: Deploy verified commit to Vercel production
        run: npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
