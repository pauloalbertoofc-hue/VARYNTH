name: Validate and deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:game-rules
      - run: npm run test:game-studio
      - name: Verify Athena conversation and specialist quality
        run: |
          npm run test:athena-system
          npm run test:athena-response-quality
          npm run test:athena-intelligence
          npm run test:athena-communication
          npx tsx src/lib/athena/agents/experience-guidance.test.ts
      - run: npm run build
      - name: Deploy verified commit to Vercel production
        run: npx vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
